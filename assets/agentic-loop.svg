<svg width="420" height="260" viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#a371f7"/>
    </marker>
  </defs>

  <rect width="420" height="260" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <text x="210" y="34" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">🤖 Agentic AI Systems</text>
  <text x="210" y="52" text-anchor="middle" fill="#8b949e" font-size="11">plan · act · observe · reflect</text>

  <!-- cycle circle -->
  <circle cx="210" cy="150" r="62" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="6 6">
    <animateTransform attributeName="transform" type="rotate" from="0 210 150" to="360 210 150" dur="14s" repeatCount="indefinite"/>
  </circle>
  <text x="210" y="147" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">LLM</text>
  <text x="210" y="163" text-anchor="middle" fill="#8b949e" font-size="10">agent core</text>

  <!-- nodes -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="160" y="66" width="100" height="26" rx="13" fill="#1f6feb22" stroke="#1f6feb"/>
    <text x="210" y="83" fill="#79c0fa">🧭 Plan</text>

    <rect x="300" y="137" width="104" height="26" rx="13" fill="#a371f722" stroke="#a371f7"/>
    <text x="352" y="154" fill="#d2a8ff">🔧 Use Tools</text>

    <rect x="160" y="212" width="100" height="26" rx="13" fill="#3fb95022" stroke="#3fb950"/>
    <text x="210" y="229" fill="#56d364">👁 Observe</text>

    <rect x="16" y="137" width="104" height="26" rx="13" fill="#d2992222" stroke="#d29922"/>
    <text x="68" y="154" fill="#e3b341">💭 Reflect</text>
  </g>

  <!-- arrows between nodes -->
  <g stroke="#8b949e" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M265,84 Q330,95 348,132"/>
    <path d="M348,168 Q330,205 265,222"/>
    <path d="M155,222 Q90,205 72,168"/>
    <path d="M72,132 Q90,95 155,84"/>
  </g>
</svg>
