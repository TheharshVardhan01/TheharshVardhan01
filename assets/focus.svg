<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto">
      <path d="M0,0 L5.5,2.5 L0,5 z" fill="#6e7681"/>
    </marker>
    <marker id="arb" markerWidth="7" markerHeight="7" refX="5.5" refY="2.5" orient="auto">
      <path d="M0,0 L5.5,2.5 L0,5 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <!-- ============ Panel 1: Agentic Systems ============ -->
  <g>
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="28" y="42" fill="#e6edf3" font-size="16" font-weight="700" letter-spacing="2">AGENTIC SYSTEMS</text>
    <text x="28" y="62" fill="#6e7681" font-size="12">autonomous planning and tool use</text>

    <!-- orbit -->
    <circle cx="160" cy="180" r="58" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="160" cy="180" r="24" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="160" y="184" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700" letter-spacing="1">LLM</text>

    <!-- orbit nodes -->
    <g font-size="11" font-weight="600">
      <circle cx="160" cy="122" r="5" fill="#0d1117" stroke="#bc8cff" stroke-width="1.5"/>
      <text x="160" y="108" text-anchor="middle" fill="#bc8cff">Plan</text>
      <circle cx="218" cy="180" r="5" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
      <text x="238" y="184" fill="#58a6ff">Act</text>
      <circle cx="160" cy="238" r="5" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
      <text x="160" y="260" text-anchor="middle" fill="#3fb950">Observe</text>
      <circle cx="102" cy="180" r="5" fill="#0d1117" stroke="#d29922" stroke-width="1.5"/>
      <text x="82" y="184" text-anchor="end" fill="#d29922">Reflect</text>
    </g>

    <!-- rotating cursor on orbit -->
    <circle cx="160" cy="122" r="3" fill="#58a6ff">
      <animateTransform attributeName="transform" type="rotate" from="0 160 180" to="360 160 180" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ Panel 2: Computer Vision ============ -->
  <g transform="translate(340,0)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="28" y="42" fill="#e6edf3" font-size="16" font-weight="700" letter-spacing="2">COMPUTER VISION</text>
    <text x="28" y="62" fill="#6e7681" font-size="12">convolutional networks, detection, forensics</text>

    <!-- input image grid -->
    <g>
      <rect x="34" y="130" width="56" height="56" rx="4" fill="#161b22" stroke="#30363d"/>
      <g stroke="#21262d" stroke-width="1">
        <path d="M48,130 V186 M62,130 V186 M76,130 V186"/>
        <path d="M34,144 H90 M34,158 H90 M34,172 H90"/>
      </g>
      <text x="62" y="206" text-anchor="middle" fill="#6e7681" font-size="10" letter-spacing="1">INPUT</text>
    </g>

    <!-- conv stage 1: stacked feature maps -->
    <g>
      <rect x="132" y="122" width="44" height="44" rx="3" fill="#161b22" stroke="#30363d"/>
      <rect x="126" y="130" width="44" height="44" rx="3" fill="#161b22" stroke="#3d4550"/>
      <rect x="120" y="138" width="44" height="44" rx="3" fill="#161b22" stroke="#58a6ff" stroke-opacity="0.8">
        <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="148" y="206" text-anchor="middle" fill="#6e7681" font-size="10" letter-spacing="1">CONV</text>
    </g>

    <!-- conv stage 2: smaller, deeper -->
    <g>
      <rect x="212" y="130" width="30" height="30" rx="3" fill="#161b22" stroke="#30363d"/>
      <rect x="207" y="136" width="30" height="30" rx="3" fill="#161b22" stroke="#3d4550"/>
      <rect x="202" y="142" width="30" height="30" rx="3" fill="#161b22" stroke="#bc8cff" stroke-opacity="0.8">
        <animate attributeName="stroke-opacity" values="0.8;0.3;0.8" dur="4s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="221" y="206" text-anchor="middle" fill="#6e7681" font-size="10" letter-spacing="1">POOL</text>
    </g>

    <!-- output nodes -->
    <g>
      <circle cx="282" cy="138" r="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.4"/>
      <circle cx="282" cy="156" r="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.4"/>
      <circle cx="282" cy="174" r="4" fill="#0d1117" stroke="#3fb950" stroke-width="1.4"/>
      <text x="282" y="206" text-anchor="middle" fill="#6e7681" font-size="10" letter-spacing="1">CLASS</text>
    </g>

    <!-- connections -->
    <g stroke="#6e7681" stroke-width="1.2" fill="none">
      <path d="M90,158 H118"/>
      <path d="M176,158 H200"/>
      <path d="M238,148 L277,138 M238,155 L277,156 M238,162 L277,174"/>
    </g>

    <!-- signal packet -->
    <circle r="2.5" fill="#58a6ff">
      <animateMotion path="M90,158 H200" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.9;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ Panel 3: MLOps ============ -->
  <g transform="translate(680,0)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="28" y="42" fill="#e6edf3" font-size="16" font-weight="700" letter-spacing="2">MLOPS</text>
    <text x="28" y="62" fill="#6e7681" font-size="12">reproducible pipelines to production</text>

    <g font-size="11" font-weight="600" text-anchor="middle">
      <rect x="34" y="110" width="76" height="30" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="72" y="129" fill="#c9d1d9">Data</text>
      <rect x="210" y="110" width="76" height="30" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
      <text x="248" y="129" fill="#c9d1d9">Train</text>
      <rect x="210" y="190" width="76" height="30" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1.2"/>
      <text x="248" y="209" fill="#c9d1d9">Evaluate</text>
      <rect x="34" y="190" width="76" height="30" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
      <text x="72" y="209" fill="#c9d1d9">Deploy</text>
    </g>

    <g stroke="#6e7681" stroke-width="1.5" fill="none" marker-end="url(#ar)">
      <path d="M112,125 H206"/>
      <path d="M248,142 V186"/>
      <path d="M208,205 H114"/>
    </g>
    <!-- monitor feedback -->
    <path d="M72,188 V158 Q72,148 82,148 H160" stroke="#58a6ff" stroke-width="1.2" stroke-dasharray="4 4" fill="none" marker-end="url(#arb)"/>
    <text x="118" y="170" fill="#6e7681" font-size="10" text-anchor="middle">monitor</text>

    <!-- moving packet -->
    <circle r="3" fill="#3fb950">
      <animateMotion path="M112,125 H206 M248,142 V186 M208,205 H114" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
