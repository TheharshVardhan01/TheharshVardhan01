<svg width="420" height="260" viewBox="0 0 420 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0e2a2a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="420" height="260" rx="14" fill="url(#bg2)" stroke="#30363d"/>
  <text x="210" y="34" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="700">👁️ Computer Vision</text>
  <text x="210" y="52" text-anchor="middle" fill="#8b949e" font-size="11">detection · forgery analysis · gesture recognition</text>

  <!-- image frame -->
  <g>
    <rect x="60" y="70" width="300" height="160" rx="8" fill="#161b22" stroke="#30363d"/>
    <!-- pixel grid -->
    <g stroke="#21262d" stroke-width="1">
      <path d="M110,70 V230 M160,70 V230 M210,70 V230 M260,70 V230 M310,70 V230"/>
      <path d="M60,110 H360 M60,150 H360 M60,190 H360"/>
    </g>

    <!-- corner brackets -->
    <g stroke="#3fb950" stroke-width="3" fill="none">
      <path d="M60,86 V78 a8,8 0 0 1 8,-8 h8"/>
      <path d="M344,70 h8 a8,8 0 0 1 8,8 v8"/>
      <path d="M360,214 v8 a8,8 0 0 1 -8,8 h-8"/>
      <path d="M76,230 h-8 a8,8 0 0 1 -8,-8 v-8"/>
    </g>

    <!-- detected objects -->
    <g font-size="10" font-weight="600">
      <rect x="95" y="100" width="70" height="55" rx="4" fill="none" stroke="#1f6feb" stroke-width="2">
        <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="95" y="88" width="62" height="13" rx="3" fill="#1f6feb"/>
      <text x="99" y="98" fill="#ffffff">hand 0.97</text>

      <rect x="235" y="130" width="86" height="72" rx="4" fill="none" stroke="#d29922" stroke-width="2">
        <animate attributeName="opacity" values="1;0.35;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="235" y="118" width="74" height="13" rx="3" fill="#d29922"/>
      <text x="239" y="128" fill="#0d1117">tamper 0.91</text>
    </g>

    <!-- scanning beam -->
    <rect x="62" y="70" width="296" height="34" fill="url(#scan)">
      <animate attributeName="y" values="70;196;70" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
